<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Made That Up?</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #111022; color: #f7f5ff;
    font-family: system-ui, sans-serif;
  }
  main { max-width: 620px; margin: auto; padding: 24px 18px 60px; }
  h1 { font-size: 2rem; line-height: 1.1; }
  h2 { line-height: 1.3; }
  p { line-height: 1.6; }
  .muted { color: #bab5d2; }
  .card {
    background: #211e38; border: 1px solid #393252;
    border-radius: 18px; padding: 22px; margin-top: 18px;
  }
  button, input, textarea, select {
    font: inherit; width: 100%; border-radius: 12px;
    padding: 15px; margin-top: 12px;
  }
  input, textarea, select {
    background: #151326; color: white; border: 1px solid #655b87;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    background: #c4a3ff; color: #171026;
    border: none; font-weight: 750; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.secondary { background: #393252; color: white; }
  .answer { text-align: left; background: #393252; color: white; }
  .badge { color: #cfb6ff; font-weight: 700; }
  .error { color: #ffb7bd; }
  .result { border-top: 1px solid #49405e; padding: 14px 0; }
  .score {
    display: flex; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid #49405e;
  }
</style>
</head>
<body>
<main>
  <p class="badge">PASS THE PHONE · PARTY GAME</p>
  <h1>Who Made That Up?</h1>
  <div id="app"></div>
</main>

<script>
const app = document.getElementById("app");

const ANSWER_LIMIT = 140;

function normalizeAnswer(value) {
  return value.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
}

function buildChoices() {
  const grouped = new Map();
  for (const answer of [...submissions, { text: deck[round].house, owner: -1 }]) {
    const key = normalizeAnswer(answer.text);
    if (!grouped.has(key)) grouped.set(key, { text: answer.text, owners: [], house: false });
    const choice = grouped.get(key);
    if (answer.owner === -1) {
      choice.house = true;
      choice.text = answer.text;
    } else choice.owners.push(answer.owner);
  }
  return shuffle([...grouped.values()]);
}

const prompts = [
  {
    "question": "What's a terrible name for a dating app?",
    "house": "Last Available Option."
  },
  {
    "question": "What's a suspicious thing to put on a résumé?",
    "house": "Usually found innocent."
  },
  {
    "question": "What's the worst thing to hear your pilot say?",
    "house": "Does anyone recognize this airport?"
  },
  {
    "question": "What should never be a subscription service?",
    "house": "Your front-door key."
  },
  {
    "question": "What's the worst feature to add to a smart fridge?",
    "house": "It tells your mother what you ate."
  },
  {
    "question": "What's the worst slogan for a moving company?",
    "house": "We lose boxes so you don't have to."
  },
  {
    "question": "What's a terrible surprise to find in a fortune cookie?",
    "house": "Your subscription to good luck has expired."
  },
  {
    "question": "What's the worst thing a dentist could say halfway through?",
    "house": "This looked easier in the video."
  },
  {
    "question": "What would a raccoon put on its business card?",
    "house": "Independent lid removal specialist."
  },
  {
    "question": "What's a terrible name for a luxury hotel?",
    "house": "The Last Resort."
  },
  {
    "question": "What should your fitness watch never tell you?",
    "house": "I counted that walk to the fridge as a vacation."
  },
  {
    "question": "What's the worst excuse for being late to your own wedding?",
    "house": "I wanted to see who else showed up."
  },
  {
    "question": "What would a dog write in a review of its owner?",
    "house": "Good roommate. Weirdly attached to the ball."
  },
  {
    "question": "What's the worst thing to hear from your GPS?",
    "house": "Follow that guy. He looks confident."
  },
  {
    "question": "What's a suspicious rule for a restaurant?",
    "house": "Please don't interview the chef."
  },
  {
    "question": "What's the worst prize in a company raffle?",
    "house": "An extra shift."
  },
  {
    "question": "What would a haunted house put in its rental listing?",
    "house": "Previous tenants remain very involved."
  },
  {
    "question": "What's a terrible feature for a dating app?",
    "house": "Your ex writes your profile."
  },
  {
    "question": "What's the worst thing to say during a job interview?",
    "house": "How strict is the whole showing up thing?"
  },
  {
    "question": "What would a cat put on its résumé?",
    "house": "Managed a household with no financial contribution."
  },
  {
    "question": "What's the worst announcement at a family reunion?",
    "house": "We will now read the group chat aloud."
  },
  {
    "question": "What should never come with a surprise fee?",
    "house": "The exit door."
  },
  {
    "question": "What's a terrible name for a babysitting service?",
    "house": "Probably Still Here."
  },
  {
    "question": "What's the worst thing a mechanic could put on your receipt?",
    "house": "Noise relocated successfully."
  },
  {
    "question": "What would aliens find most confusing about humans?",
    "house": "We pay to run indoors without going anywhere."
  },
  {
    "question": "What's a terrible motivational poster for an office?",
    "house": "Someone has to be the example in the training video."
  },
  {
    "question": "What's the worst feature for a smart toilet?",
    "house": "A public leaderboard."
  },
  {
    "question": "What's an unusual reason to get banned from a grocery store?",
    "house": "Leaving reviews on individual grapes."
  },
  {
    "question": "What's the worst thing to hear from your barber?",
    "house": "Let's call it a fresh start."
  },
  {
    "question": "What would a mosquito say in a dating profile?",
    "house": "Looking for my type. Preferably O positive."
  },
  {
    "question": "What's a terrible slogan for an airline?",
    "house": "Your luggage deserves its own adventure."
  },
  {
    "question": "What should a robot never learn from humans?",
    "house": "How to reply all."
  },
  {
    "question": "What's the worst theme for a surprise party?",
    "house": "People who have a complaint about you."
  },
  {
    "question": "What's a terrible thing to put in an out-of-office reply?",
    "house": "Ask someone who cares."
  },
  {
    "question": "What would your couch say if it could talk?",
    "house": "I know where your money went."
  }
];

let players = [];
let deck = [];
let round = 0;
let turn = 0;
let submissions = [];
let choices = [];
let votes = [];
let awards = [];
let celebrationTimer = null;
let partyExtras = {};

function resetPartyExtras() {
  partyExtras = { favorite: null, nickname: null, gag: null };
}
resetPartyExtras();

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[char]));
}

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function screen(html) {
  clearInterval(celebrationTimer);
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

function roundLabel() {
  return `<p class="badge">ROUND ${round + 1} OF ${deck.length}</p>`;
}

function showSetup() {
  screen(`
    <section class="card">
      <h2>Fool your friends.</h2>
      <p>Write a funny answer. Then guess which answer was secretly
      added by the game.</p>
      <p>Earn 1 point for each person you fool and 2 points for
      spotting the house answer. Matching answers share one choice;
      each author earns a point per person fooled. You cannot vote for
      your own answer. Match the house yourself and earn 2 points at the reveal.</p>
      <p>Earn end-of-game titles for spotting the house, fooling friends, matching the house, and landing the biggest bluff.</p>
      <label for="names">Enter 3–8 player names, one per line.</label>
      <textarea id="names" placeholder="Alex&#10;Jordan&#10;Sam"></textarea>
      <p id="error" class="error" role="alert"></p>
      <button id="start">Start game</button>
      <p class="muted">Use short, distinct names. This prototype keeps
      the game in this tab only—refreshing resets it.</p>
    </section>
  `);

  document.getElementById("start").onclick = () => {
    const names = document.getElementById("names").value
      .split("\n").map(name => name.trim()).filter(Boolean);
    const unique = new Set(names.map(name => name.toLowerCase()));

    if (names.length < 3 || names.length > 8) {
      document.getElementById("error").textContent =
        "Please enter between 3 and 8 names.";
      return;
    }
    if (unique.size !== names.length) {
      document.getElementById("error").textContent =
        "Please give each player a different name.";
      return;
    }
    if (names.some(name => name.length > 24)) {
      document.getElementById("error").textContent =
        "Keep each name to 24 characters or fewer.";
      return;
    }

    resetPartyExtras();
    players = names.map(name => ({ name, score: 0, correctGuesses: 0, fooled: 0, houseMatches: 0, biggestBluff: 0 }));
    deck = shuffle(prompts).slice(0, 5);
    round = 0;
    beginRound();
  };
}

function handoff(playerIndex, task, next) {
  screen(`
    ${roundLabel()}
    <section class="card">
      <h2>Pass the phone to ${escapeHTML(players[playerIndex].name)}</h2>
      <p>Everyone else, look away.</p>
      <button id="ready">I'm ${escapeHTML(players[playerIndex].name)} — ${task}</button>
    </section>
  `);
  document.getElementById("ready").onclick = next;
}

function beginRound() {
  turn = 0;
  submissions = [];
  choices = [];
  votes = [];
  handoff(turn, "write my answer", showAnswerEntry);
}

function showAnswerEntry() {
  screen(`
    ${roundLabel()}
    <section class="card">
      <p class="muted">${escapeHTML(players[turn].name)}'s turn</p>
      <h2>${escapeHTML(deck[round].question)}</h2>
      <label for="answer">Write one short, funny answer (${ANSWER_LIMIT} characters maximum).</label>
      <textarea id="answer" maxlength="${ANSWER_LIMIT}"
        placeholder="Your answer…"></textarea>
      <p id="error" class="error" role="alert"></p>
      <button id="submit">Lock answer & hide screen</button>
    </section>
  `);

  document.getElementById("submit").onclick = () => {
    const text = document.getElementById("answer").value.trim();
    if (!text) {
      document.getElementById("error").textContent =
        "Write an answer before continuing.";
      return;
    }

    if (text.length > ANSWER_LIMIT) {
      document.getElementById("error").textContent =
        `Keep your answer to ${ANSWER_LIMIT} characters or fewer.`;
      return;
    }
    if (!normalizeAnswer(text)) {
      document.getElementById("error").textContent =
        "Include at least one letter or number in your answer.";
      return;
    }

    submissions.push({ text, owner: turn });
    turn++;

    if (turn < players.length) {
      handoff(turn, "write my answer", showAnswerEntry);
    } else {
      choices = buildChoices();
      turn = 0;
      handoff(turn, "cast my vote", showVoting);
    }
  };
}

function showVoting() {
  screen(`
    ${roundLabel()}
    <section class="card">
      <p class="muted">${escapeHTML(players[turn].name)}'s vote</p>
      <h2>${escapeHTML(deck[round].question)}</h2>
      <p>Which answer came from the house?
      Your own answer is hidden from your choices.</p>
      ${choices.map((answer, index) =>
        answer.owners.includes(turn) ? "" : `
          <button class="answer" data-choice="${index}">
            ${escapeHTML(answer.text)}
          </button>
        `
      ).join("")}
    </section>
  `);

  document.querySelectorAll("[data-choice]").forEach(button => {
    button.onclick = () => {
      votes.push(Number(button.dataset.choice));
      turn++;
      if (turn < players.length) {
        handoff(turn, "cast my vote", showVoting);
      } else {
        scoreRound();
        showReveal();
      }
    };
  });
}

function scoreRound() {
  awards = players.map(() => 0);
  const houseChoice = choices.find(answer => answer.house);
  houseChoice.owners.forEach(owner => {
    awards[owner] += 2;
    players[owner].houseMatches++;
  });
  const roundFooled = players.map(() => 0);
  votes.forEach((choiceIndex, voterIndex) => {
    const answer = choices[choiceIndex];
    if (answer.house) {
      if (!houseChoice.owners.includes(voterIndex)) {
        awards[voterIndex] += 2;
        players[voterIndex].correctGuesses++;
      }
    } else {
      answer.owners.forEach(owner => {
        if (owner !== voterIndex) {
          awards[owner] += 1;
          players[owner].fooled++;
          roundFooled[owner]++;
        }
      });
    }
  });
  players.forEach((player, index) => {
    player.score += awards[index];
    player.biggestBluff = Math.max(player.biggestBluff, roundFooled[index]);
  });
}

function leaderboard(showRoundPoints) {
  return players.map((player, index) => ({ ...player, index }))
    .sort((a, b) => b.score - a.score)
    .map(player => `
      <div class="score">
        <span>${escapeHTML(player.name)}</span>
        <span>${player.score} pts
        ${showRoundPoints ? `(+${awards[player.index]})` : ""}</span>
      </div>
    `).join("");
}

function showReveal() {
  screen(`
    ${roundLabel()}
    <section class="card">
      <h2>The reveal</h2>
      <p>${escapeHTML(deck[round].question)}</p>
      ${choices.map((answer, index) => {
        const fooled = votes.reduce((names, vote, voter) => {
          if (vote === index) names.push(players[voter].name);
          return names;
        }, []);
        return `
          <div class="result">
            <p>${escapeHTML(answer.text)}</p>
            <p class="badge">${answer.house
              ? "HOUSE ANSWER" + (answer.owners.length
                ? " — matched by " + answer.owners.map(owner => escapeHTML(players[owner].name)).join(", ") + " (+2 each)"
                : "")
              : answer.owners.map(owner => escapeHTML(players[owner].name)).join(", ") + "'s answer"}</p>
            <p class="muted">Voted for by:
              ${fooled.length ? fooled.map(escapeHTML).join(", ") : "Nobody"}
            </p>
          </div>
        `;
      }).join("")}
      <h2>Scores</h2>
      ${leaderboard(true)}
      <button id="next">
        ${round + 1 < deck.length ? "Next round" : "See final results"}
      </button>
    </section>
  `);

  document.getElementById("next").onclick = () => {
    round++;
    if (round < deck.length) beginRound();
    else showFinal();
  };
}


function gameTitles() {
  const titles = [];
  function award(title, field, description) {
    const best = Math.max(...players.map(player => player[field]));
    if (best === 0) return;
    titles.push({
      title, description: description(best),
      names: players.filter(player => player[field] === best).map(player => player.name)
    });
  }
  award("House Whisperer", "correctGuesses",
    count => count + " correct house guesses");
  award("Silver Tongue", "fooled",
    count => count + " votes fooled across the game");
  award("Sneaky Mirror", "houseMatches",
    count => count + " answers matched the house");
  award("Chaos Goblin", "biggestBluff",
    count => count + " players fooled in a single round");
  return titles;
}

function titleCards() {
  return gameTitles().map(award => `
    <div class="result">
      <p class="badge">${escapeHTML(award.title)}</p>
      <p>${award.names.map(escapeHTML).join(" & ")}</p>
      <p class="muted">${escapeHTML(award.description)}</p>
    </div>
  `).join("") || '<p class="muted">No titles earned this game. Try another round!</p>';
}


const partyGags = [
  "Deliver a 15-second campaign speech explaining why you deserved to win.",
  "Read an imaginary weather forecast for the mood in this room.",
  "Give your best dramatic villain laugh.",
  "Advertise an imaginary product that absolutely nobody needs.",
  "Accept an imaginary award for spectacularly suspicious answers.",
  "Speak like a robot until the next game starts, or for one minute."
];

function partyRewardCards(winners, losers, allTied) {
  return `
    <section class="card">
      <h2>👑 ${winners.length > 1 ? "Shared crown" : "Party royalty"}</h2>
      <p class="badge">${winners.map(p => escapeHTML(p.name)).join(" & ")}</p>
      <p>${winners.length > 1 ? "Agree together on" : "You choose"} the next game the group plays. If you stay here, start another five-round game.</p>
      <button id="rematch">Play again with these players</button>
      <h3>Victory spotlight</h3>
      <p>Take the floor for a 15-second victory speech. Co-winners share the spotlight.</p>
      <p id="speech-status" role="status">Ready for your speech?</p>
      <button id="speech">Start 15-second spotlight</button>
      <h3>Nickname authority</h3>
      <p>Give a willing player a nickname to use aloud during the next game.</p>
      <label for="nickname-player">Willing player</label>
      <select id="nickname-player">
        ${players.map((p,i)=>`<option value="${i}">${escapeHTML(p.name)}</option>`).join("")}
      </select>
      <label for="nickname">Nickname (24 characters maximum)</label>
      <input id="nickname" maxlength="24" placeholder="Captain Questionable">
      <button id="save-nickname">They agree — award nickname</button>
      <p id="nickname-status" role="status">${partyExtras.nickname ? escapeHTML(partyExtras.nickname) : ""}</p>
    </section>
    <section class="card">
      <h2>Crowd Favorite</h2>
      <p>As a group, choose whose answer made you laugh the most. This is a separate award worth bragging rights.</p>
      <label for="favorite-player">Group's choice</label>
      <select id="favorite-player">
        <option value="">Choose a player</option>
        ${players.map((p,i)=>`<option value="${i}">${escapeHTML(p.name)}</option>`).join("")}
      </select>
      <button id="save-favorite">Award Crowd Favorite</button>
      <p id="favorite-status" role="status">${partyExtras.favorite === null ? "" : escapeHTML(players[partyExtras.favorite].name) + " is the Crowd Favorite!"}</p>
    </section>
    <section class="card">
      <h2>Last-place encore</h2>
      ${allTied ? "<p>Everyone tied — no last-place gag this time.</p>" : `
        <p>${losers.map(p=>escapeHTML(p.name)).join(" & ")}: want one last chance to make everyone laugh?</p>
        <p>Optional, with no score penalty for skipping. Tied players can volunteer together or choose one willing performer.</p>
        <p id="gag-status" role="status">${escapeHTML(partyExtras.gag || "Draw a silly performance gag, or skip.")}</p>
        <button id="draw-gag">Draw a gag</button>
        <button id="skip-gag" class="secondary">Skip the gag</button>
      `}
    </section>
  `;
}

function bindPartyRewards() {
  document.getElementById("rematch").onclick = () => {
    resetPartyExtras();
    players.forEach(p => {
      p.score = 0; p.correctGuesses = 0; p.fooled = 0;
      p.houseMatches = 0; p.biggestBluff = 0;
    });
    deck = shuffle(prompts).slice(0, 5);
    round = 0;
    beginRound();
  };
  document.getElementById("speech").onclick = () => {
    clearInterval(celebrationTimer);
    const deadline = Date.now() + 15000;
    const status = document.getElementById("speech-status");
    status.textContent = "15 seconds — the floor is yours!";
    celebrationTimer = setInterval(() => {
      const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      status.textContent = remaining ? remaining + " seconds remaining" : "Time! Give your champion a round of applause.";
      if (!remaining) clearInterval(celebrationTimer);
    }, 250);
  };
  document.getElementById("save-nickname").onclick = () => {
    const name = document.getElementById("nickname").value.trim();
    const value = document.getElementById("nickname-player").value;
    const index = Number(value);
    const status = document.getElementById("nickname-status");
    if (!name || name.length > 24 || value === "" || !players[index]) {
      status.textContent = "Choose a player and enter a nickname of 1–24 characters.";
      return;
    }
    partyExtras.nickname = players[index].name + " will answer to “" + name + "” next game.";
    status.textContent = partyExtras.nickname;
  };
  document.getElementById("save-favorite").onclick = () => {
    const value = document.getElementById("favorite-player").value;
    const index = Number(value);
    const status = document.getElementById("favorite-status");
    if (value === "" || !players[index]) {
      status.textContent = "Choose the group's favorite first.";
      return;
    }
    partyExtras.favorite = index;
    status.textContent = players[index].name + " is the Crowd Favorite!";
  };
  const draw = document.getElementById("draw-gag");
  if (draw) {
    draw.onclick = () => {
      const options = partyGags.filter(gag => gag !== partyExtras.gag);
      partyExtras.gag = options[Math.floor(Math.random() * options.length)];
      document.getElementById("gag-status").textContent = partyExtras.gag;
    };
    document.getElementById("skip-gag").onclick = () => {
      partyExtras.gag = "Gag skipped. On to the next game!";
      document.getElementById("gag-status").textContent = partyExtras.gag;
    };
  }
}

function showFinal() {
  const highest = Math.max(...players.map(player => player.score));
  const winners = players.filter(player => player.score === highest);
  const lowest = Math.min(...players.map(player => player.score));
  const losers = players.filter(player => player.score === lowest);
  screen(`
    <section class="card">
      <h2>${winners.length > 1 ? "It's a tie!" : "We have a winner!"}</h2>
      <p>${winners.map(player => escapeHTML(player.name)).join(" & ")}</p>
      ${leaderboard(false)}
      <h2>Earned titles</h2>
      <p class="muted">Titles celebrate this game. Tied players share a title. Save a screenshot for bragging rights.</p>
      ${titleCards()}
      <p class="muted">This pack has ${prompts.length} prompts, with five randomly selected per game.
      Returning players may remember the house answers.</p>
      <button id="restart">Back to player setup</button>
    </section>
    ${partyRewardCards(winners, losers, highest === lowest)}
  `);
  bindPartyRewards();
  document.getElementById("restart").onclick = showSetup;
}

showSetup();
</script>
</body>
</html>
